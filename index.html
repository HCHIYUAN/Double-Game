        // --- 核心邏輯 (相同) ---
        function calcPairPointsByRules(a, b, par) {
            if (a === null || b === null || a === '' || b === '') return 0;
            const aRel = a - par;
            const bRel = b - par;
            let points = 0;
            if (aRel === 0 && bRel > 0) points = 2;
            if (aRel > 0 && bRel === 0) points = -2;
            if (aRel > 0 && bRel > 0) points = (a < b) ? 1 : (b < a) ? -1 : 0;
            if (aRel < 0 && bRel >= 0) points = (aRel === -1) ? ((bRel === 0) ? 1 : 3) : ((bRel === 0) ? 3 : 5);
            if (bRel < 0 && aRel >= 0) points = -((bRel === -1) ? ((aRel === 0) ? 1 : 3) : ((aRel === 0) ? 3 : 5));
            if (aRel < 0 && bRel < 0) points = (a < b) ? ((aRel <= -2) ? 3 : 1) : (b < a) ? -((bRel <= -2) ? 3 : 1) : 0;
            if ((par === 4 || par === 5) && a >= par * 2 && a > b) points -= 1;
            if ((par === 4 || par === 5) && b >= par * 2 && b > a) points += 1;
            return points;
        }

        function calcTeamMatch(scores, par, multiplier) {
            if (scores.some(s => !s)) return { diff: 0, abScore: 0, cdScore: 0, msg: '等待輸入...' };
            const s = scores.map(Number);
            let abRaw = s[0] < s[1] ? s[0] * 10 + s[1] : s[1] * 10 + s[0];
            let cdRaw = s[2] < s[3] ? s[2] * 10 + s[3] : s[3] * 10 + s[2];
            const getStatus = (score) => { if (score <= par - 2) return 'eagle'; if (score === par - 1) return 'birdie'; return 'normal'; };
            const abStatuses = [getStatus(s[0]), getStatus(s[1])];
            const cdStatuses = [getStatus(s[2]), getStatus(s[3])];
            const abHasEagle = abStatuses.includes('eagle');
            const abHasBirdie = abStatuses.includes('birdie');
            const cdHasEagle = cdStatuses.includes('eagle');
            const cdHasBirdie = cdStatuses.includes('birdie');
            let abFinal = abRaw;
            let cdFinal = cdRaw;
            let finalMultiplier = multiplier;
            let msgParts = [];
            if (abHasEagle) { cdFinal = parseInt(String(cdRaw).split('').reverse().join(''), 10); finalMultiplier *= 2; msgParts.push("AB Eagle! CD互換且加倍"); }
            else if (abHasBirdie) { cdFinal = parseInt(String(cdRaw).split('').reverse().join(''), 10); msgParts.push("AB Birdie! CD互換"); }
            if (cdHasEagle) { abFinal = parseInt(String(abRaw).split('').reverse().join(''), 10); finalMultiplier *= 2; msgParts.push("CD Eagle! AB互換且加倍"); }
            else if (cdHasBirdie) { abFinal = parseInt(String(abRaw).split('').reverse().join(''), 10); msgParts.push("CD Birdie! AB互換"); }
            const diff = (cdFinal - abFinal) * finalMultiplier;
            return { diff, abScore: abFinal, cdScore: cdFinal, abRaw, cdRaw, finalMultiplier, msg: msgParts.join(' | ') };
        }

                const initialData = {
                    names: ['球員 A', '球員 B', '球員 C', '球員 D'],
                    golfScores: Array(18).fill([null, null, null, null]),
                    pointScores: Array(18).fill(['blank', 'blank', 'blank', 'blank']),
                    multipliers: Array(18).fill(1),
                    courseId: 'guanyinshan',
                    startNine: 'out',
                    goldenBallHole: 18,
                    teamStake: 10,
                    pointValues: { cut: 150, gold: 100, silver: 50, bronze: 30, iron: 20 },
                    updatedAt: new Date()
                };
                try {
                    await setDoc(doc(db, "games", newId), initialData);
                    setGameId(newId);
                    localStorage.setItem('golf_game_id', newId);
                } catch(e) { 
                    console.error(e); 
                    alert("建立失敗: " + e.message); 
                }
                setLoading(false);
            };

            const joinGame = (id) => {
                setGameId(id);
                localStorage.setItem('golf_game_id', id);
            };

            const leaveGame = () => {
                if(confirm("確定要離開房間嗎？")) {
                    setGameId(null);
                    localStorage.removeItem('golf_game_id');
                }
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
            if (!gameId) return <Lobby onCreate={createGame} onJoin={joinGame} />;
            return <GolfApp gameId={gameId} onLeave={leaveGame} />;
        }

        // --- Core App Logic ---
        function GolfApp({ gameId, onLeave }) {
            const [data, setData] = useState(null);
            const [connected, setConnected] = useState(false);
            
            // UI States
            const [mode, setMode] = useState('golf');
            const [currentHoleIdx, setCurrentHoleIdx] = useState(0);
            const [viewMode, setViewMode] = useState('input');
            const [showSettings, setShowSettings] = useState(false);
            const [showCourseEditor, setShowCourseEditor] = useState(false);
            
            // Local settings that don't need sync
            const [customCourses, setCustomCourses] = useState([]);
            const [courseList, setCourseList] = useState(DEFAULT_COURSES);
            const [courseParData, setCourseParData] = useState(DEFAULT_COURSE_PAR);

            // 1. Sync Logic
            useEffect(() => {
                if (!gameId || !window.db) return;
                const unsub = onSnapshot(doc(window.db, "games", gameId), (docSnap) => {
                    if (docSnap.exists()) {
                        setData(docSnap.data());
                        setConnected(true);
                    } else {
                        alert("找不到此房間，請確認代碼");
                        onLeave();
                    }
                }, (error) => {
                    console.error("Sync Error", error);
                    setConnected(false);
                });
                return () => unsub();
            }, [gameId]);

            // 2. Load Custom Courses locally
            useEffect(() => {
                const saved = localStorage.getItem('my_golf_courses');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed)) {
                            setCustomCourses(parsed);
                            setCourseList([...DEFAULT_COURSES, ...parsed.map(c => ({ id: c.id, name: c.name }))]);
                            const newPar = { ...DEFAULT_COURSE_PAR };
                            parsed.forEach(c => { newPar[c.id] = { out: c.out, in: c.in }; });
                            setCourseParData(newPar);
                        }
                    } catch (e) {}
                }
            }, []);

            // 3. Write Helper
            const updateGame = useCallback((updates) => {
                if(!window.db || !gameId) return;
                updateDoc(doc(window.db, "games", gameId), { ...updates, updatedAt: new Date() }).catch(e => console.error("Write failed", e));
            }, [gameId]);

            // Handlers (Adapted for Firebase)
            const handleGolfScoreChange = (pIdx, delta) => {
                if(!data) return;
                const newScores = [...data.golfScores];
                let currentVal = newScores[currentHoleIdx][pIdx];
                if (currentVal === null || currentVal === '') currentVal = parList[currentHoleIdx];
                else currentVal = Number(currentVal) + delta;
                if (currentVal < 1) currentVal = 1;
                newScores[currentHoleIdx] = [...newScores[currentHoleIdx]];
                newScores[currentHoleIdx][pIdx] = currentVal;
                updateGame({ golfScores: newScores });
            };

            const handlePointToggle = (pIdx) => {
                if(!data) return;
                const types = POINT_TYPES.map(t => t.id);
                const nextIdx = (types.indexOf(data.pointScores[currentHoleIdx][pIdx]) + 1) % types.length;
                const newScores = [...data.pointScores];
                newScores[currentHoleIdx] = [...newScores[currentHoleIdx]];
                newScores[currentHoleIdx][pIdx] = types[nextIdx];
                updateGame({ pointScores: newScores });
            };

            const handleMultiplierChange = (delta) => {
                if(!data) return;
                const newMults = [...data.multipliers];
                let val = newMults[currentHoleIdx] + delta;
                if (val < 1) val = 1; else if (val > 6) val = 6;
                newMults[currentHoleIdx] = val;
                updateGame({ multipliers: newMults });
            };

            const handleRandomMultiplier = useCallback(() => {
                if(!data) return;
                let rolls = 0;
                const maxRolls = 10;
                const intervalId = setInterval(() => {
                    const val = Math.ceil(Math.random() * 6);
                    if (rolls >= maxRolls) {
                        clearInterval(intervalId);
                        const newMults = [...data.multipliers];
                        newMults[currentHoleIdx] = val;
                        updateGame({ multipliers: newMults });
                    }
                    rolls++;
                }, 60);
            }, [currentHoleIdx, data, updateGame]);

            const resetGame = () => {
                if (!confirm('確定要清除所有成績重新開始嗎？')) return;
                updateGame({
                    golfScores: Array(18).fill([null, null, null, null]),
                    pointScores: Array(18).fill(['blank', 'blank', 'blank', 'blank']),
                    multipliers: Array(18).fill(1)
                });
                setCurrentHoleIdx(0);
                setShowSettings(false);
            };

            const copyRoomId = () => {
                navigator.clipboard.writeText(gameId);
                alert("房號已複製！");
            }

            // Loading state
            if (!data) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            // Derived State
            const { parList, holeNumbers } = useMemo(() => {
                const course = courseParData[data.courseId] || DEFAULT_COURSE_PAR['guanyinshan'];
                let pars = [], nums = [];
                if (data.startNine === 'out') { pars = [...course.out, ...course.in]; nums = [...Array(9).keys().map(i=>i+1), ...Array(9).keys().map(i=>i+10)]; } 
                else { pars = [...course.in, ...course.out]; nums = [...Array(9).keys().map(i=>i+10), ...Array(9).keys().map(i=>i+1)]; }
                return { parList: pars, holeNumbers: nums };
            }, [data.courseId, data.startNine, courseParData]);

            const golfResults = useMemo(() => {
                const playerTotals = [0, 0, 0, 0];
                const playerStrokes = [0, 0, 0, 0];
                const holePoints = Array(18).fill(null).map(() => [0, 0, 0, 0]);
                data.golfScores.forEach((scores, hIdx) => {
                    const par = parList[hIdx];
                    const holeNo = holeNumbers[hIdx];
                    const isGolden = holeNo === Number(data.goldenBallHole);
                    const isComplete = scores.every(s => s !== null && s !== '' && s > 0);
                    scores.forEach((s, pIdx) => { if(s) playerStrokes[pIdx] += Number(s); });
                    if (!isComplete) return;
                    const pts = [0, 0, 0, 0];
                    for (let i = 0; i < 4; i++) {
                        for (let j = i + 1; j < 4; j++) {
                            let p = calcPairPointsByRules(scores[i], scores[j], par);
                            if (isGolden) { if (Number(scores[i]) < Number(scores[j])) p += 1; else if (Number(scores[j]) < Number(scores[i])) p -= 1; }
                            pts[i] += p; pts[j] -= p;
                        }
                    }
                    pts.forEach((p, i) => { holePoints[hIdx][i] = p; playerTotals[i] += p; });
                });
                return { playerTotals, playerStrokes, holePoints };
            }, [data.golfScores, parList, holeNumbers, data.goldenBallHole]);

            const pointResults = useMemo(() => {
                const totals = [0, 0, 0, 0];
                const holeRes = data.pointScores.map(row => {
                    const rowPts = [0, 0, 0, 0];
                    const winners = [];
                    row.forEach((type, pIdx) => { if (type !== 'blank' && type !== 'none') winners.push({ idx: pIdx, val: data.pointValues[type] || 0 }); });
                    row.forEach((myType, i) => {
                        if (myType === 'blank') return;
                        let change = 0;
                        const myVal = data.pointValues[myType] || 0;
                        if (myType !== 'none') { const validPlayersCount = row.filter(t => t !== 'blank').length; change += myVal * (validPlayersCount - 1); }
                        winners.forEach(w => { if (w.idx !== i) change -= w.val; });
                        rowPts[i] = change; totals[i] += change;
                    });
                    return rowPts;
                });
                return { totals, holeRes };
            }, [data.pointScores, data.pointValues]);

            const teamResults = useMemo(() => {
                const totals = [0, 0, 0, 0];
                const holeDetails = [];
                data.golfScores.forEach((scores, hIdx) => {
                    const par = parList[hIdx];
                    const mult = data.multipliers[hIdx];
                    const result = calcTeamMatch(scores, par, mult);
                    holeDetails.push(result);
                    if (result.diff !== 0) { const money = result.diff * data.teamStake; totals[0] += money; totals[1] += money; totals[2] -= money; totals[3] -= money; }
                });
                return { totals, holeDetails };
            }, [data.golfScores, data.multipliers, data.teamStake, parList]);

            const currentPar = parList[currentHoleIdx];
            const currentHoleNo = holeNumbers[currentHoleIdx];
            const isGolden = Number(data.goldenBallHole) === currentHoleNo;
            const currentTeamHoleData = teamResults.holeDetails[currentHoleIdx];
            const getLeader = (totals) => totals.map((s, i) => ({s, i})).sort((a,b) => b.s - a.s)[0];
            const golfLeader = getLeader(golfResults.playerTotals);
            const pointLeader = getLeader(pointResults.totals);
            const teamLeader = getLeader(teamResults.totals);

            return (
                <div className="min-h-screen bg-gray-100 font-sans text-gray-900 pb-48">
                    <div className="bg-emerald-600 text-white p-4 sticky top-0 z-20 shadow-md">
                        <div className="max-w-md mx-auto space-y-3">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-emerald-700 rounded-full transition"><Settings /></button>
                                    <div className="flex flex-col">
                                        <div className="text-sm font-medium opacity-90">{courseList.find(c=>c.id===data.courseId)?.name}</div>
                                        <div onClick={copyRoomId} className="text-[10px] flex items-center gap-1 opacity-75 cursor-pointer hover:opacity-100">{connected ? <Wifi size={10} /> : <WifiOff size={10} />} 房號: {gameId} <Copy size={10}/></div>
                                    </div>
                                </div>
                                <div className="flex bg-emerald-700 rounded-lg p-0.5">
                                    <button onClick={() => setViewMode('input')} className={`p-2 rounded-md ${viewMode === 'input' ? 'bg-white text-emerald-700' : 'text-emerald-100'}`}><Grid /></button>
                                    <button onClick={() => setViewMode('card')} className={`p-2 rounded-md ${viewMode === 'card' ? 'bg-white text-emerald-700' : 'text-emerald-100'}`}><List /></button>
                                </div>
                            </div>
                            <div className="flex bg-emerald-800/50 p-1 rounded-xl">
                                {['golf','point','team'].map(m => (
                                    <button key={m} onClick={() => setMode(m)} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${mode === m ? 'bg-white text-emerald-700 shadow' : 'text-emerald-100 hover:bg-emerald-700/50'}`}>{m==='golf'?'高爾夫':m==='point'?'金銀銅鐵':'團體對抗'}</button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto p-4">
                        {viewMode === 'input' ? (
                            <>
                                <div className="bg-white rounded-2xl shadow-sm p-4 mb-4 flex justify-between items-center">
                                    <button onClick={() => setCurrentHoleIdx(Math.max(0, currentHoleIdx - 1))} className="p-3 bg-gray-50 rounded-xl hover:bg-gray-100 text-gray-600 disabled:opacity-30" disabled={currentHoleIdx === 0}><ChevronLeft /></button>
                                    <div className="text-center">
                                        <h2 className="text-2xl font-black text-gray-800 flex items-center justify-center gap-2">Hole {currentHoleNo} {isGolden && <span className="text-yellow-500 animate-pulse">⭐</span>}</h2>
                                        <p className="text-gray-500 font-medium">Par {currentPar}</p>
                                    </div>
                                    <button onClick={() => setCurrentHoleIdx(Math.min(17, currentHoleIdx + 1))} className="p-3 bg-gray-50 rounded-xl hover:bg-gray-100 text-gray-600 disabled:opacity-30" disabled={currentHoleIdx === 17}><ChevronRight /></button>
                                </div>

                                {mode === 'team' && (
                                    <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-3 mb-4 flex items-center justify-between">
                                        <span className="font-bold text-indigo-800 flex items-center gap-2"><Calculator /> 本洞倍數</span>
                                        <div className="flex items-center gap-3">
                                            <button onClick={handleRandomMultiplier} className="w-8 h-8 flex items-center justify-center rounded-full bg-purple-500 text-white shadow-sm hover:bg-purple-600 active:scale-90 transition-all"><Dice /></button>
                                            <div className="w-px h-6 bg-indigo-200 mx-1"></div>
                                            <button onClick={() => handleMultiplierChange(-1)} className="w-8 h-8 rounded-full bg-white text-indigo-600 font-bold border border-indigo-200">-</button>
                                            <span className="text-xl font-black text-indigo-900 w-8 text-center">{data.multipliers[currentHoleIdx]}</span>
                                            <button onClick={() => handleMultiplierChange(1)} className="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold shadow">+</button>
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {data.names.map((name, idx) => {
                                        let displayTotal = mode === 'golf' ? golfResults.playerTotals[idx] : mode === 'point' ? pointResults.totals[idx] : teamResults.totals[idx];
                                        return (
                                            <div key={idx} className={`bg-white rounded-xl shadow-sm p-3 flex items-center justify-between border ${mode === 'team' && idx < 2 ? 'border-l-4 border-l-blue-500' : mode === 'team' ? 'border-l-4 border-l-orange-500' : 'border-gray-100'}`}>
                                                <div className="flex flex-col min-w-[80px]">
                                                    <span className="font-bold text-gray-800 truncate flex items-center gap-1">{name} {mode === 'team' && <span className={`text-[10px] px-1 rounded ${idx < 2 ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}`}>{idx < 2 ? 'AB' : 'CD'}</span>}</span>
                                                    <span className={`text-xs font-mono font-bold ${displayTotal >= 0 ? 'text-red-500' : 'text-green-600'}`}>{mode === 'team' && '$'}{displayTotal > 0 ? '+' : ''}{displayTotal}</span>
                                                </div>
                                                {mode === 'point' ? (
                                                    <button onClick={() => handlePointToggle(idx)} className={`flex-1 ml-4 py-3 px-4 rounded-xl border-2 transition-all active:scale-95 flex justify-between items-center ${POINT_TYPES.find(t=>t.id === data.pointScores[currentHoleIdx][idx])?.color}`}>
                                                        <span className="font-bold text-lg">{POINT_TYPES.find(t=>t.id === data.pointScores[currentHoleIdx][idx])?.label}</span>
                                                        <span className="text-xs opacity-60">{POINT_TYPES.find(t=>t.id === data.pointScores[currentHoleIdx][idx])?.val}</span>
                                                    </button>
                                                ) : (
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => handleGolfScoreChange(idx, -1)} className="w-12 h-12 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-xl flex items-center justify-center active:scale-95 transition">-</button>
                                                        <div className={`w-14 h-14 rounded-xl flex flex-col items-center justify-center border-2 ${!data.golfScores[currentHoleIdx][idx] ? 'border-gray-200 bg-gray-50' : 'border-emerald-500 bg-emerald-50 text-emerald-800'}`}>
                                                            <span className="text-2xl font-bold">{data.golfScores[currentHoleIdx][idx] || '-'}</span>
                                                        </div>
                                                        <button onClick={() => handleGolfScoreChange(idx, 1)} className="w-12 h-12 rounded-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold text-xl flex items-center justify-center active:scale-95 transition">+</button>
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>

                                {mode === 'golf' && data.golfScores[currentHoleIdx].every(s => s) && (
                                    <div className="mt-4 bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                                        <h4 className="text-center text-xs text-emerald-600 font-bold uppercase tracking-wider mb-2">本洞對戰 (比洞)</h4>
                                        <div className="grid grid-cols-4 text-center">{golfResults.holePoints[currentHoleIdx].map((pt, i) => <div key={i} className={`font-bold ${pt > 0 ? 'text-red-500' : pt < 0 ? 'text-green-600' : 'text-gray-400'}`}>{pt > 0 ? '+' : ''}{pt}</div>)}</div>
                                    </div>
                                )}

                                {mode === 'team' && data.golfScores[currentHoleIdx].every(s => s) && (
                                    <div className="mt-4 bg-white rounded-xl shadow-lg border border-indigo-200 overflow-hidden">
                                        <div className="bg-indigo-600 text-white p-2 text-center text-sm font-bold flex justify-between px-4"><span>AB 隊</span><span>VS</span><span>CD 隊</span></div>
                                        <div className="p-4 flex justify-between items-center">
                                            <div className="text-center"><div className="text-xs text-gray-500 mb-1">原始: {currentTeamHoleData.abRaw}</div><div className={`text-3xl font-black ${currentTeamHoleData.diff > 0 ? 'text-red-500' : 'text-gray-800'}`}>{currentTeamHoleData.abScore}</div></div>
                                            <div className="flex flex-col items-center"><span className="text-xs text-indigo-500 font-bold bg-indigo-50 px-2 py-1 rounded-full mb-1">x{currentTeamHoleData.finalMultiplier}</span><span className="text-xl font-bold text-gray-400">Diff: {Math.abs(currentTeamHoleData.abScore - currentTeamHoleData.cdScore)}</span></div>
                                            <div className="text-center"><div className="text-xs text-gray-500 mb-1">原始: {currentTeamHoleData.cdRaw}</div><div className={`text-3xl font-black ${currentTeamHoleData.diff < 0 ? 'text-red-500' : 'text-gray-800'}`}>{currentTeamHoleData.cdScore}</div></div>
                                        </div>
                                        {currentTeamHoleData.msg && <div className="bg-yellow-50 text-yellow-800 text-xs text-center py-1 border-t border-yellow-100">🔥 {currentTeamHoleData.msg}</div>}
                                        <div className="bg-gray-50 p-3 text-center border-t"><span className="text-gray-500 text-sm">本洞結算: </span><span className={`text-lg font-bold ml-2 ${currentTeamHoleData.diff !== 0 ? 'text-red-600' : 'text-gray-400'}`}>{currentTeamHoleData.diff > 0 ? 'AB隊' : currentTeamHoleData.diff < 0 ? 'CD隊' : '平手'} {currentTeamHoleData.diff !== 0 && ` 贏 ${Math.abs(currentTeamHoleData.diff)}分 ($${Math.abs(currentTeamHoleData.diff) * data.teamStake})`}</span></div>
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 gap-4">
                                    <div className="bg-white rounded-2xl shadow p-4 border border-gray-100"><h3 className="font-bold text-gray-700 mb-3 flex items-center gap-2"><Trophy /> 目前總戰績 (高爾夫)</h3><div className="grid grid-cols-4 gap-2 text-center text-sm">{data.names.map((n, i) => <div key={i} className="flex flex-col p-2 bg-gray-50 rounded-lg"><span className="text-xs text-gray-500 truncate">{n}</span><span className="font-bold text-gray-800">{golfResults.playerStrokes[i]} 桿</span><span className={`text-xs ${golfResults.playerTotals[i] >= 0 ? 'text-red-500' : 'text-green-600'}`}>{golfResults.playerTotals[i] > 0 ? '+' : ''}{golfResults.playerTotals[i]} 點</span></div>)}</div></div>
                                    <div className="bg-white rounded-2xl shadow p-4 border border-gray-100"><h3 className="font-bold text-gray-700 mb-3 flex items-center gap-2"><Medal /> 金銀銅鐵 (點數)</h3><div className="grid grid-cols-4 gap-2 text-center text-sm">{data.names.map((n, i) => <div key={i} className="flex flex-col p-2 bg-gray-50 rounded-lg"><span className="text-xs text-gray-500 truncate">{n}</span><span className={`font-bold ${pointResults.totals[i] >= 0 ? 'text-red-500' : 'text-green-600'}`}>{pointResults.totals[i]}</span></div>)}</div></div>
                                    <div className="bg-white rounded-2xl shadow p-4 border border-gray-100"><h3 className="font-bold text-gray-700 mb-3 flex items-center gap-2"><Users /> 團體對抗 (金額)</h3><div className="grid grid-cols-4 gap-2 text-center text-sm">{data.names.map((n, i) => <div key={i} className={`flex flex-col p-2 rounded-lg ${i<2 ? 'bg-blue-50' : 'bg-orange-50'}`}><span className="text-xs text-gray-500 truncate">{n}</span><span className={`font-bold ${teamResults.totals[i] >= 0 ? 'text-red-500' : 'text-green-600'}`}>${teamResults.totals[i]}</span></div>)}</div></div>
                                </div>
                                <div className="bg-white rounded-2xl shadow overflow-hidden border border-gray-200">
                                    <div className="bg-gray-50 p-2 text-center text-xs text-gray-500 font-bold uppercase">詳細桿數表</div>
                                    <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50 border-b"><th className="p-2 sticky left-0 bg-gray-50">H</th>{data.names.map((n, i) => <th key={i} className="p-2 min-w-[50px]">{n.slice(0,1)}</th>)}</tr></thead><tbody className="divide-y">{parList.map((par, hIdx) => <tr key={hIdx} className={hIdx === currentHoleIdx ? 'bg-yellow-50' : ''}><td className="p-2 font-bold text-gray-500 sticky left-0 bg-white border-r text-center">{holeNumbers[hIdx]}</td>{data.names.map((_, pIdx) => <td key={pIdx} className="p-2 text-center font-bold text-gray-800">{data.golfScores[hIdx][pIdx] || '-'}</td>)}</tr>)}</tbody></table></div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 inset-x-0 bg-white border-t p-3 pb-6 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] md:pb-3 z-10">
                        <div className="max-w-md mx-auto grid grid-cols-4 gap-2">
                            {data.names.map((name, i) => {
                                let total = mode === 'golf' ? golfResults.playerTotals[i] : mode === 'point' ? pointResults.totals[i] : teamResults.totals[i];
                                let isLeading = (mode === 'golf' ? golfLeader.i : mode === 'point' ? pointLeader.i : teamLeader.i) === i && total > 0;
                                return (
                                    <div key={i} className={`flex flex-col items-center p-1 rounded-lg ${isLeading ? 'bg-yellow-50' : ''}`}>
                                        <span className="text-[10px] text-gray-500 truncate w-full text-center">{name}</span>
                                        <span className={`font-bold text-sm md:text-base ${total > 0 ? 'text-red-500' : total < 0 ? 'text-green-600' : 'text-gray-400'}`}>{mode === 'team' && '$'}{total > 0 ? '+' : ''}{total}</span>
                                        {isLeading && <Trophy />}
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <Modal isOpen={showSettings} onClose={() => setShowSettings(false)} title="遊戲設定">
                        {!showCourseEditor ? (
                            <div className="space-y-6">
                                <div className="space-y-2"><label className="text-sm font-bold text-gray-700">球員姓名</label><div className="grid grid-cols-2 gap-2">{data.names.map((n, i) => <input key={i} value={n} onChange={(e) => { const newNames = [...data.names]; newNames[i] = e.target.value; updateGame({ names: newNames }); }} className="border rounded px-2 py-1.5 text-sm" placeholder={`Player ${i+1}`} />)}</div></div>
                                <div className="space-y-4 pt-4 border-t">
                                    <div><div className="flex justify-between items-center mb-1"><label className="text-sm font-bold text-gray-700">球場</label><button onClick={() => setShowCourseEditor(true)} className="text-xs flex items-center gap-1 text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded-full"><Plus /> 新增球場</button></div><select value={data.courseId} onChange={(e) => updateGame({ courseId: e.target.value })} className="w-full border rounded px-3 py-2 bg-white">{courseList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>{customCourses.find(c => c.id === data.courseId) && <button onClick={() => { if(confirm('確定要刪除？')) deleteCustomCourse(data.courseId); }} className="mt-2 text-xs text-red-500 flex items-center gap-1"><Trash2 /> 刪除球場</button>}</div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-sm font-bold text-gray-700 block mb-1">前九</label><select value={data.startNine} onChange={(e) => updateGame({ startNine: e.target.value })} className="w-full border rounded px-3 py-2 bg-white"><option value="out">OUT (1-9)</option><option value="in">IN (10-18)</option></select></div>
                                        <div><label className="text-sm font-bold text-gray-700 block mb-1">Golden Ball</label><select value={data.goldenBallHole} onChange={(e) => updateGame({ goldenBallHole: e.target.value })} className="w-full border rounded px-3 py-2 bg-white">{[...Array(18)].map((_,i) => { const h = data.startNine === 'out' ? i+1 : (i<9 ? i+10 : i-8); return <option key={i} value={holeNumbers[i]}>Hole {holeNumbers[i]}</option> })}</select></div>
                                    </div>
                                </div>
                                <div className="space-y-4 pt-4 border-t"><label className="text-sm font-bold text-gray-700 block">團體賽每分金額</label><div className="flex items-center gap-2"><DollarSign /><input type="number" value={data.teamStake} onChange={(e) => updateGame({ teamStake: Number(e.target.value) })} className="border rounded px-3 py-2 w-full"/></div></div>
                                <div className="space-y-4 pt-4 border-t"><label className="text-sm font-bold text-gray-700 block">金銀銅鐵點數設定</label><div className="grid grid-cols-3 gap-2 text-sm">{Object.keys(data.pointValues).map(k => <div key={k} className="flex flex-col"><span className="text-gray-500 uppercase text-xs">{k}</span><input type="number" value={data.pointValues[k]} onChange={(e) => updateGame({ pointValues: { ...data.pointValues, [k]: Number(e.target.value) } })} className="border rounded px-2 py-1"/></div>)}</div></div>
                                <div className="pt-4 border-t border-gray-100 flex flex-col gap-3">
                                    <button onClick={() => setShowSettings(false)} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 shadow">完成設定</button>
                                    <button onClick={resetGame} className="w-full bg-white text-red-500 border border-red-200 py-3 rounded-xl font-bold hover:bg-red-50 flex items-center justify-center gap-2"><RotateCcw size={18} /> 開始新的一局 (清除成績)</button>
                                    <button onClick={onLeave} className="w-full text-gray-400 text-xs py-2 hover:text-gray-600">離開房間 (清除連線)</button>
                                </div>
                            </div>
                        ) : (
                            <CourseEditor onSave={(newData) => { saveCustomCourse(newData); setShowCourseEditor(false); }} onCancel={() => setShowCourseEditor(false)} />
                        )}
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GolfAppWrapper />);
    </script>
</body>
</html>
